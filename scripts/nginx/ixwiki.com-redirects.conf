# IxStates redirect rules — add these to the ixwiki.com HTTPS server block
# Replaces the old `location ^~ /projects/ixstats` proxy block
#
# These 301 redirects preserve bookmarks, search results, and external links
# after migrating IxStates from ixwiki.com/projects/ixstats to ixstates.ixwiki.com

# Old /projects/ixstats path → redirect to ixstates.ixwiki.com
location ^~ /projects/ixstats {
    rewrite ^/projects/ixstats(.*)$ https://ixstates.ixwiki.com$1 permanent;
}

# Also handle /projects/ixstates (the renamed path, in case any links exist)
location ^~ /projects/ixstates {
    rewrite ^/projects/ixstates(.*)$ https://ixstates.ixwiki.com$1 permanent;
}

# WikiOS routes — proxy directly to IxStates (basePath="" means no prefix needed)
location ^~ /w/ {
    proxy_pass http://127.0.0.1:3550;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location ^~ /wiki-special/ {
    proxy_pass http://127.0.0.1:3550;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
