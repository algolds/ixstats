# ============================================================================================
# WikiOS takeover of ixwiki.com/wiki/*  (plan 417)            *** NOT APPLIED - review first ***
# ============================================================================================
# Install as /etc/nginx/snippets/wikios-takeover.conf and pull it into the existing
#   server { server_name ixwiki.com www.ixwiki.com; ... }
# block of /etc/nginx/sites-enabled/ixwiki.com with one line, `include snippets/wikios-takeover.conf;`,
# placed before the existing locations. Also required:
#   - scripts/ops/nginx/wikios-upstream.conf      -> /etc/nginx/conf.d/   (upstream + $wikios_view and
#                                                    $wikios_wiki_classic maps)
#   - scripts/ops/nginx/wikios-proxy-params.conf  -> /etc/nginx/snippets/ (shared proxy headers)
#
# EXISTING CONFIG THIS REPLACES (delete these, or `nginx -t` fails with duplicate locations):
#   1. `location ^~ /wiki/ { try_files $uri @mediawiki; }`
#        replaced by `location ^~ /wiki/` below (WikiOS) and `location ^~ /classic/` (classic MediaWiki).
#   2. In `location @mediawiki`: the `^/wiki/(.*)$ -> /index.php?title=$1&$args` rewrite line.
#        Keep the `^/search/(.*)$` and `^/([^/]+)$` rewrites exactly as they are (section 6).
#   3. Any existing `location = /` (the main-page redirect below takes over `/`).
#
# NEW LOCATION (plan 410): `location ^~ /w/` below sends WikiOS's own MediaWiki-compatible Action API
# (`/w/api.php`, for Pywikibot, AWB and the like) to WikiOS. `/w/` is not used by classic MediaWiki on this
# server (it lives at the web root: /index.php, /api.php), so nothing is replaced.
#
# EXISTING CONFIG THIS LEAVES ALONE: `location = /load.php`, `location = /api.php` (the public api.php
# stays MediaWiki's: WikiOS's is at /w/api.php), `location ~ ^/rest\.php`, `location ^~ /api/discord/`,
# `location ^~ /projects/ixstats`, `location /images/` and the thumb locations, the root-level
# `/(MediaWiki|Special|Template|Help|Category|User|File|Talk):...` regex location, and
# `location ~ \.php$` (PHP-FPM, limit_req zone=wiki_general).
#
# PAIRED CHANGE: /ixwiki/config/LocalSettings.php must set $wgArticlePath = '/classic/$1' (that is
# scripts/ops/mediawiki/wikios-localsettings.php), otherwise MediaWiki keeps generating /wiki/ links.
# ============================================================================================


# --------------------------------------------------------------------------------------------
# 1. index.php page views -> WikiOS, everything else stays on classic MediaWiki (PHP-FPM)
# --------------------------------------------------------------------------------------------
# Only a direct GET/HEAD of /index.php that is a plain page view (no action, or action=view) of a
# non-Special title is redirected:
#     /index.php?title=Foo                      -> 301 /wiki/Foo
#     /index.php?title=Foo&oldid=12             -> 301 /wiki/Foo?oldid=12
#     /index.php?title=Foo&diff=13              -> 301 /wiki/Foo?diff=13
#     /index.php?title=Foo&oldid=12&diff=13     -> 301 /wiki/Foo?oldid=12&diff=13   (plan 412)
# edit, history, submit, raw, purge, render, redirect=no, POSTs, Special: pages, requests without a
# title and /classic/* (rewritten to /index.php internally) continue to PHP untouched.
#
# This is written as server-level rewrite-phase directives instead of inside `location = /index.php`
# on purpose: an exact-match `location = /index.php` would take over PHP handling from the existing
# `location ~ \.php$` block and would have to duplicate its fastcgi settings (which this file cannot
# see). Server-level `if` + `return` is the safe use of `if`, and `$request_uri` (the URL as the
# client sent it, unchanged by internal redirects) is what tells a real index.php request apart from
# the /classic/ and Special:FilePath rewrites below.
#
# The flag string is built one letter at a time; only the exact strings I, IO, ID, IOD redirect:
#   I direct /index.php request   M not GET/HEAD   A action other than view   X no title
#   S Special: title (any case, or encoded colon)  R redirect=no (editors inspecting a redirect page)
#   O oldid present                                D diff present
#
# $arg_title is the raw query value: `+` and `%20` are passed through unchanged, and WikiOS
# canonicalises the title (plan 410/412), so no decoding is attempted here.
set $wikios_idx "";
if ($request_uri ~ "^/index\.php(\?|$)") { set $wikios_idx "I"; }
if ($request_method !~ "^(GET|HEAD)$")   { set $wikios_idx "${wikios_idx}M"; }
if ($wikios_view = 0)                    { set $wikios_idx "${wikios_idx}A"; }
if ($arg_title = "")                     { set $wikios_idx "${wikios_idx}X"; }
if ($arg_title ~* "^special(:|%3a)")     { set $wikios_idx "${wikios_idx}S"; }
if ($arg_redirect = "no")                { set $wikios_idx "${wikios_idx}R"; }
if ($arg_oldid != "")                    { set $wikios_idx "${wikios_idx}O"; }
if ($arg_diff != "")                     { set $wikios_idx "${wikios_idx}D"; }

if ($wikios_idx = "I")   { return 301 /wiki/$arg_title; }
if ($wikios_idx = "IO")  { return 301 /wiki/$arg_title?oldid=$arg_oldid; }
if ($wikios_idx = "ID")  { return 301 /wiki/$arg_title?diff=$arg_diff; }
if ($wikios_idx = "IOD") { return 301 /wiki/$arg_title?oldid=$arg_oldid&diff=$arg_diff; }


# --------------------------------------------------------------------------------------------
# 2. Site root
# --------------------------------------------------------------------------------------------
location = / {
    return 302 /wiki/Main_Page;
}


# --------------------------------------------------------------------------------------------
# 3. Classic MediaWiki moves to /classic/ (paired with $wgArticlePath = '/classic/$1')
# --------------------------------------------------------------------------------------------
# nginx appends the original query string itself when a rewrite replacement has a query part, so each
# original parameter reaches PHP twice (`...&action=edit&action=edit`). MediaWiki ignores the
# duplicate; the existing @mediawiki rewrites behave the same way, and the same applies to every
# `rewrite ... /index.php?title=$1&$args` in this file.
location ^~ /classic/ {
    rewrite ^/classic/(.*)$ /index.php?title=$1&$args last;
}


# --------------------------------------------------------------------------------------------
# 4. File and redirect special pages stay on MediaWiki
# --------------------------------------------------------------------------------------------
# WikiOS HTML references https://ixwiki.com/wiki/Special:FilePath/<File> for images; MediaWiki
# resolves those to the /images/ upload path. Special:Redirect (file/<name>, revision/<id>, user/<id>,
# page/<id>) is MediaWiki's permalink redirector and is kept on MediaWiki for the same reason. Every
# other Special: page is served by WikiOS (plan 410/412).
#
# These are `^~` prefixes (longer than `^~ /wiki/` below, so they win) and not regex locations: a regex
# location is never consulted once a `^~` prefix matched, so `location ~ ^/wiki/Special:FilePath/`
# would be dead code next to `^~ /wiki/`. Only this exact casing is routed to MediaWiki; other casings
# reach WikiOS.
location ^~ /wiki/Special:FilePath/ {
    rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
}

location ^~ /wiki/Special:Redirect/ {
    rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
}

location = /wiki/Special:Redirect {
    rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
}


# --------------------------------------------------------------------------------------------
# 5. WikiOS (proxy to 127.0.0.1:3560, see wikios-upstream.conf)
# --------------------------------------------------------------------------------------------
# Articles and everything under /wiki/. Actions WikiOS does not serve (see $wikios_wiki_classic in
# wikios-upstream.conf: purge, render, submit, delete, protect, watch, markpatrolled, ...) are rewritten
# to MediaWiki before anything is proxied: `rewrite ... last` is the safe use of `if` inside a location
# that proxies. limit_req mirrors the protection these URLs had when they went through
# `location ~ \.php$` (zone wiki_general is defined in the existing http{} config).
location ^~ /wiki/ {
    if ($wikios_wiki_classic) {
        rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
    }
    limit_req zone=wiki_general burst=20 nodelay;
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /util/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location = /stashes {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /stashes/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

# Next.js build assets (basePath is empty in the WikiOS build, see deploy/wikios/next-config-snippet.md).
location ^~ /_next/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /api/trpc/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

# The browser's file upload (plan 411): the file is the raw request body, at most 10,000,000 bytes (WikiOS counts them as they
# stream and answers 413 itself; nginx's ceiling only has to be above that). Longer match than `^~ /api/wiki/`, so it wins.
location = /api/wiki/upload {
    client_max_body_size 11m;
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /api/wiki/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /api/wikios/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /api/mediawiki/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location = /robots.txt {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /sitemap {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

# WikiOS' own sitemap index (`/wiki-sitemap`, plans 410/412); `/sitemap` above keeps MediaWiki's name working.
location ^~ /wiki-sitemap {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

# Not in plan item 2, added because WikiOS pages request them at runtime and, without a location here,
# nginx would hand them to MediaWiki (`location /` -> @mediawiki -> index.php?title=...). They mirror
# WIKIOS_ALLOWED_PREFIXES in src/lib/system/wikios-standalone.ts, which lists the code that makes each one:
#   /fonts/       National/Akzidenz fonts (typography.css) and MapLibre glyphs (base-path.ts)
#   /wikios-*, /favicon-wikios, /images/wikios*   logo and favicon
#   /flags/, /images/flags/   flag files and the placeholder (`location /images/` would look in the
#                             MediaWiki uploads directory)
#   /images/uploads/          pictures uploaded in IxStates (a country's flag is stored as
#                             /images/uploads/<file>; the Main Page's country grid shows them). Same reason:
#                             `location /images/` would look for them in MediaWiki's tree and answer 404.
#                             MediaWiki's own /images/<a>/<ab>/<File> and /images/thumb/ stay with its location.
#   /maplibre/    MapLibre worker of the country and coordinate map embeds
#   /api/ixtime/current   IxTime store, fetched on every page by IxTimeProvider
#   /api/onoma/tts        article narrator
#   /sign-in, /sign-up, /sso-callback   Clerk routes
location ^~ /fonts/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /wikios- {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /favicon-wikios {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /images/wikios {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /flags/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /images/flags/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /images/uploads/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /maplibre/ {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location = /api/ixtime/current {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /api/onoma/tts {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

# Not served by WikiOS but forwarded to it: article coordinate embeds are iframes of /maps?embed=true
# (src/lib/wiki-os/editor/wiki-embed-shared.ts, injected by ArticleRenderer, which also adds a
# <link rel="prefetch"> for it on every article view). In the standalone build that URL is
# root-relative on ixwiki.com, so without this location it would reach MediaWiki. The standalone guard
# in src/proxy.ts does not list /maps, so it answers 302 to the IxStates /maps with the query string kept.
# Only the exact path is forwarded: it shadows a MediaWiki article titled "maps" (lower case).
location = /maps {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /sign-in {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /sign-up {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}

location ^~ /sso-callback {
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}


# --------------------------------------------------------------------------------------------
# 5b. WikiOS api.php, the MediaWiki-compatible Action API (plan 410): /w/api.php
# --------------------------------------------------------------------------------------------
# Bots log in with a bot password and edit through it, so request bodies are larger than anywhere else
# in this file: an edit carries up to 2,000,000 characters of wikitext. nginx's default
# `client_max_body_size` (1m) would refuse such an edit with a bare 413 before WikiOS saw it. WikiOS
# limits the body itself (4 MB, counted while it reads the stream; 413 with a MediaWiki `toobig`
# error), so nginx's ceiling only has to be above that for WikiOS to be the one that answers.
# WikiOS also applies its own per-client rate limits (buckets `wiki_api`, `wiki_api_write`,
# `wiki_api_login`, `wiki_api_render`; docs/operations/wikios-v1-cutover.md), so no limit_req here.
# The login and session cookies are HttpOnly and scoped to /w/. The client address those limits use
# is the proxy chain's trusted client identity (CF-Connecting-IP, else X-Real-IP).
# `action=upload` (plan 411) is a multipart POST of the file (at most 10,000,000 bytes) plus up to 64 KiB of fields, so the
# ceiling is above that (11m). WikiOS still refuses what is too large itself: a request without a session may send 4 MB.
location ^~ /w/ {
    client_max_body_size 11m;
    include snippets/wikios-proxy-params.conf;
    proxy_pass http://wikios;
}


# --------------------------------------------------------------------------------------------
# 6. MANUAL EDIT in the existing config (nothing to paste)
# --------------------------------------------------------------------------------------------
# `location @mediawiki` currently reads (the facts recorded on 2026-09-30):
#     rewrite ^/wiki/(.*)$    /index.php?title=$1&$args ...;     <- DELETE this line: WikiOS owns /wiki/
#     rewrite ^/search/(.*)$  ...Special:Search...;              <- keep as is
#     rewrite ^/([^/]+)$      /index.php?title=$1 ...;           <- keep as is
# The root-level namespace regex location (`/(MediaWiki|Special|Template|Help|Category|User|File|Talk):...`
# -> index.php) is kept unchanged. Root-level short URLs (`/Foo`, `/Help:Foo`, `/search/...`) are NOT
# redirected to WikiOS: they reach index.php through an internal rewrite, and section 1 only redirects
# requests whose own URL is /index.php. They keep serving classic MediaWiki, whose canonical link
# (scripts/ops/mediawiki/wikios-localsettings.php) already points at the WikiOS article.
