# /etc/nginx/conf.d/wikios-upstream.conf  (http{} context; conf.d/*.conf is already included there)
#
# WikiOS takeover of ixwiki.com/wiki/* (plan 417). NOT APPLIED - an operator installs it in step 8 of
# docs/operations/wikios-v1-cutover.md, together with wikios-takeover.conf.

# The standalone WikiOS process (pm2 app `wikios`, deploy/wikios/ecosystem.wikios.config.cjs.example).
upstream wikios {
    server 127.0.0.1:3560;
    keepalive 32;
}

# index.php?action=... : 1 when the request is a plain page view (no action, or action=view).
# Used by wikios-takeover.conf to decide which index.php URLs become WikiOS /wiki/ redirects.
map $arg_action $wikios_view {
    default 0;
    ""      1;
    view    1;
}

# /wiki/<Title>?action=... : 0 for the actions WikiOS serves itself (plan 412: view, edit, history, raw,
# info), 1 for every other action, which stays on classic MediaWiki (PHP-FPM): purge, render, submit,
# delete, protect, watch, unwatch, markpatrolled, rollback, revert, credits, ... Used by the
# `location ^~ /wiki/` block of wikios-takeover.conf.
map $arg_action $wikios_wiki_classic {
    default 1;
    ""      0;
    view    0;
    edit    0;
    history 0;
    raw     0;
    info    0;
}
