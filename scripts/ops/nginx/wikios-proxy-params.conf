# /etc/nginx/snippets/wikios-proxy-params.conf
#
# Proxy settings shared by every WikiOS location in wikios-takeover.conf (plan 417). NOT APPLIED.
# Same forwarding headers as the `location ^~ /projects/ixstats` block, minus the Upgrade/Connection
# pair: WikiOS does not use WebSockets here, and `Connection ""` is what lets the `keepalive 32`
# upstream pool actually keep connections open.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
