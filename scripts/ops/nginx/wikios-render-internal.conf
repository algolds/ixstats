# /etc/nginx/conf.d/wikios-render-internal.conf   (conf.d is http{} context; this file is a server{})
#
# Private MediaWiki engine for WikiOS (plan 417, owner decision D1). NOT APPLIED.
#
# WikiOS sends Postgres wikitext to `action=parse&text=` and fetches ResourceLoader output from this
# loopback-only server instead of the public ixwiki.com vhost, so the render engine no longer needs
# to be reachable from outside and is not subject to the public rate limits or bot defences.
#
# Every other server-side call WikiOS makes to IxWiki's MediaWiki goes through it too (plan 415): the
# mirror's bot login, `action=edit`, `action=import` and `action=upload` (plans 407 and 411), and the
# inbound sync's reads.
#
# WikiOS env (in /ixwiki/public/wikios/.env.production.local or the PM2 ecosystem file):
#     WIKIOS_MEDIAWIKI_INTERNAL_URL=http://127.0.0.1:8081/api.php
#
# Install in step 4 of docs/operations/wikios-v1-cutover.md, then `nginx -t && systemctl reload nginx`.

server {
    listen 127.0.0.1:8081;
    server_name wikios-render.internal;

    # PLACEHOLDER: set this to the same root as the ixwiki.com server block (the MediaWiki install
    # that contains api.php and load.php).
    root /ixwiki/public;

    # Defence in depth on top of the loopback-only listen address.
    allow 127.0.0.1;
    deny all;

    access_log off;

    # Large pages are POSTed as `text=`; the nginx default of 1m would reject the biggest articles. This server
    # also carries the mirror's `action=import` and `action=upload` POSTs: an import uploads the page as an XML
    # file of up to about 10 MB (XML escaping makes a 2 MB page of `&` that big), and an upload sends a file.
    # PHP's `upload_max_filesize` and `post_max_size` must be 16M or more as well (step 3 of the cutover).
    client_max_body_size 16m;

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # The mirror waits up to IMPORT_TIMEOUT_MS (120 s, adapters/mediawiki/write-service.ts) for an `action=import` of
        # a big batch; nginx must outlast it, or WikiOS would be answered with a 504 while MediaWiki is still working.
        fastcgi_read_timeout 130s;
    }

    location = /load.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Nothing else is served: no index.php, no static files, no Special pages.
    location / {
        return 404;
    }
}
