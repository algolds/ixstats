# /etc/nginx/sites-available/ixwiki-stage3.conf
# Stage 3 MediaWiki Headless Render Service Isolation & UI Lockdown
#
# Directs all public web traffic to WikiOS (Next.js App Router).
# Restricts MediaWiki (PHP-FPM) to loopback rendering and API services.

server {
    listen 443 ssl http2;
    server_name ixwiki.com;

    # SSL configuration managed by certbot / Cloudflare
    ssl_certificate /etc/letsencrypt/live/ixwiki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ixwiki.com/privkey.pem;

    root /var/www/ixwiki;
    index index.php;

    # -----------------------------------------------------------------------
    # 1. Public Media & Static Assets (Unrestricted)
    # -----------------------------------------------------------------------
    location ^~ /images/ {
        alias /var/www/ixwiki/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location = /thumb.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location = /load.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        expires 7d;
    }

    location ^~ /resources/ {
        alias /var/www/ixwiki/resources/;
        expires 7d;
    }

    location ^~ /skins/ {
        alias /var/www/ixwiki/skins/;
        expires 7d;
    }

    # -----------------------------------------------------------------------
    # 2. Internal MediaWiki APIs & Parsoid (Loopback / Localhost Only)
    # -----------------------------------------------------------------------
    location ~ ^/(api\.php|rest\.php) {
        # Restrict strictly to localhost / internal Docker network
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # -----------------------------------------------------------------------
    # 3. 301 Permanent Redirects for Legacy MediaWiki URLs to WikiOS
    # -----------------------------------------------------------------------
    location ~ ^/wiki/(.*)$ {
        return 301 https://ixwiki.com/wiki/$1;
    }

    location = /index.php {
        # Redirect queries like /index.php?title=Main_Page -> /wiki/Main_Page
        if ($arg_title != "") {
            return 301 https://ixwiki.com/wiki/$arg_title;
        }
        return 301 https://ixwiki.com/wiki/Main_Page;
    }

    # -----------------------------------------------------------------------
    # 4. Proxy all WikiOS application traffic to Next.js (Port 3550 / 3000)
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3550;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
