name: CI

on:
  pull_request:
  push:
    branches: [master, development, rose-garden]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        id: prisma
        run: bun run db:generate

      # Unit tests are blocking; pre-existing failures live in scripts/verification/test-quarantine.json (shrink-only).
      # Architecture guard and strict lint are blocking (green since 2026-10-05).
      # The gates after unit tests run once setup succeeded, even after an earlier gate failed, so one red gate
      # hides no others; the job still fails if any gate fails.
      - name: Fetch base branch for quarantine growth check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Unit tests (blocking; quarantined files skipped)
        env:
          QUARANTINE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~0' }}
        run: bun run test:ci -- --compare-base "$QUARANTINE_BASE"

      - name: Quarantine shrink check (reports fixed tests)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run test:quarantine:verify
        continue-on-error: true

      - name: Entrypoint syntax check
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run check:entrypoints

      # Ratchet: no new file over the ceiling, no growth past arch-baseline.json, no cross-router imports.
      - name: Architecture guard
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run audit:arch

      # Functions the React Compiler silently skips, per file; the count only falls (react-compiler-ratchet.baseline.json).
      - name: React Compiler skips
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run check:compiler

      # 0 errors and 24 warnings on 2026-10-05; the limit only ratchets down.
      - name: Lint (strict)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run lint:strict

      - name: Typecheck (UI)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:ui

      - name: Typecheck (Server)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:server

      - name: Typecheck (tRPC)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:trpc

      - name: Typecheck (DB)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:db

      - name: Typecheck (scripts, proxy, instrumentation, content)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:scripts

      - name: Typecheck (tests)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run typecheck:tests

      # Exactly what next build's type phase checks; the partitioned configs above can miss a build-breaking error.
      - name: Typecheck (Next build config)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Validate script targets
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run validate:script-targets

      - name: Package script imports resolve
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run check:script-imports

      - name: Validate reference documentation
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: bun run docs:check
