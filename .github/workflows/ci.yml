name: CI

on:
  pull_request:
  push:
    branches: [master, development, main, v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate

      # Measured-green gates are blocking. Gates with known pre-existing baseline
      # failures (as measured on 2026-08-20) remain continue-on-error until their owning remediation plans land.
      - name: Unit tests
        run: bun run test
        continue-on-error: true

      - name: "Architecture guard (2026-08-20 baseline: non-blocking pending Plan 154 ratchet split)"
        run: bun run audit:arch
        continue-on-error: true

      - name: "Lint (Strict) (2026-08-20 baseline: non-blocking pending lint cleanups)"
        run: bun run lint:strict
        continue-on-error: true

      - name: Typecheck (UI)
        run: bun run typecheck:ui

      - name: Typecheck (Server)
        run: bun run typecheck:server

      - name: Typecheck (tRPC)
        run: bun run typecheck:trpc

      - name: Validate script targets
        run: bun run validate:script-targets

      - name: Validate reference documentation
        run: bun run docs:check
