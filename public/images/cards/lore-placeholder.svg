<svg width="400" height="560" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="360" height="520" rx="8" fill="none" stroke="#475569" stroke-width="2" opacity="0.3"/>

  <!-- Book icon -->
  <g transform="translate(150, 200)">
    <!-- Book cover -->
    <rect x="0" y="0" width="100" height="130" rx="4" fill="url(#bookGrad)"/>
    <rect x="5" y="5" width="90" height="120" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.4"/>

    <!-- Book spine lines -->
    <line x1="15" y1="10" x2="15" y2="120" stroke="#cbd5e1" stroke-width="1" opacity="0.6"/>
    <line x1="85" y1="10" x2="85" y2="120" stroke="#475569" stroke-width="1" opacity="0.6"/>

    <!-- Decorative symbol -->
    <circle cx="50" cy="65" r="20" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.5"/>
    <path d="M 50 50 L 50 80 M 35 65 L 65 65" stroke="#e2e8f0" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" font-weight="bold">
    LORE CARD
  </text>
  <text x="200" y="410" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Historical Archive
  </text>

  <!-- Subtle corner decorations -->
  <path d="M 30 30 L 50 30 M 30 30 L 30 50" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <path d="M 370 30 L 350 30 M 370 30 L 370 50" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <path d="M 30 530 L 50 530 M 30 530 L 30 510" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <path d="M 370 530 L 350 530 M 370 530 L 370 510" stroke="#475569" stroke-width="2" opacity="0.4"/>
</svg>
